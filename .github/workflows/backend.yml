name: FastAPI Backend CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - "services/api/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "services/api/**"

jobs:
  test:
    name: Run Pytest Suite & Code Integrity
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: focusflow_user
          POSTGRES_PASSWORD: focusflow_password
          POSTGRES_DB: focusflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: services/api/requirements.txt

      - name: Install dependencies
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-asyncio email-validator

      - name: Execute pytest test suite
        working-directory: services/api
        env:
          DATABASE_URL: postgresql://focusflow_user:focusflow_password@localhost:5432/focusflow_test
          REDIS_URL: redis://localhost:6379/0
          AI_PROVIDER: mock
        run: python -m pytest -v
