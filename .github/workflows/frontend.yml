name: Web Frontend CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "apps/web/**"

jobs:
  build-and-test:
    name: Build & Validate React Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: TypeScript type-check and Vite build
        working-directory: apps/web
        run: npm run build
