name: Docker Build Validation

on:
  push:
    branches: [main, master]
    paths:
      - "**/Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "**/Dockerfile"
      - "docker-compose.yml"

jobs:
  validate-docker:
    name: Build Multi-Service Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate API Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: ./services/api
          push: false
          tags: focusflow-api:test

      - name: Validate Notification Service Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: ./services/notification-service
          push: false
          tags: focusflow-notifications:test

      - name: Validate Web Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: false
          tags: focusflow-web:test
